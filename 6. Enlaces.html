<!DOCTYPE html> 
<html lang="en"> 
<head>
    
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Enlaces en HTML</title> <!-- Define el título que nos va a aparecer en el navegador-->
</head>
<body>
    <!--Titulo dobre lo que se tratara el texto-->
    <h2>Tipos de enlaces en HTML</h2>

    <!--utiliza "strong" para poner en negritas el texto-->
    <p><strong>Enlaces/Hipervinculos a otra pagina del mismo sitio.</strong></p>

    <!--seccion de enlaces a otras paginas-->

    <!--Seccion de enlaces basicos-->
    <a href="1. Hola_mundo.html">1. Hola Mundo</a><br> <!-- <br> inserta un salto de línea manual -->
  
    <a href="2. Encabezados.html" target="_self">2. Encabezados</a><br>

    <a href="3. Parrafos.html" target="_blank">3. Parrafos</a><br>

    <a href="4. Salto de linea.html" target="_parent">4. Salto de linea</a><br>

    <a href="5. Enfatizado.html" target="_top">5. Enfatizado</a><br>

    <!-- Párrafo explicativo para la siguiente sección, con "strong" para resaltar el texto -->
    <p><strong>Enlaces/Hipervinculos a sitios externos</strong></p>

    <!--seccion solo de url-->

    <!--enlace externo-->
    <a href="https://www.google.com/">Google</a><br>

    <!--enlace externo-->
    <a href="https://www.youtube.com/" target="_self">YouTube</a><br>

    <!--enlace externo-->
    <a href="https://www.facebook.com/" target="_blank">FaceBook</a><br>

    <!--"parent" se usa para abrir un archivo externo en otra ventana-->
    <a href="https://www.wikipedia.com/" target="_parent">WikiPedia</a><br>

    <!-- Enlace externo que rompe marcos y se abre en la ventana completa -->
    <a href="https://www.espanol.yahoo.com/" target="_top">Yahoo!</a><br>
</body>
</html>
